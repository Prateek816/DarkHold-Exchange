<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sigilGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#B9A7FF" />
      <stop offset="50%" stopColor="#7B2FF7" />
      <stop offset="100%" stopColor="#19E3B1" />
    </linearGradient>
    <radialGradient id="sigilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#7B2FF7" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#0B0914" stopOpacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#0D0B18" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(185,167,255,0.25)" stroke-width="1.5" />

  <!-- Ambient background glow -->
  <circle cx="32" cy="32" r="26" fill="url(#sigilGlow)" opacity="0.65" />

  <!-- Outer Diamond Orbit -->
  <path
    d="M 32,8 L 56,32 L 32,56 L 8,32 Z"
    fill="none"
    stroke="rgba(185,167,255,0.2)"
    stroke-width="1.2"
    stroke-dasharray="2 3"
  />

  <!-- Main 8-Pointed Cybernetic Sigil -->
  <g filter="url(#softGlow)">
    <!-- Primary 4-pointed Star -->
    <path
      d="M 32,10 C 32,24 24,32 10,32 C 24,32 32,40 32,54 C 32,40 40,32 54,32 C 40,32 32,24 32,10 Z"
      fill="url(#sigilGrad)"
      stroke="#B9A7FF"
      stroke-width="1"
    />

    <!-- Secondary 4-pointed Star at 45 degrees -->
    <path
      d="M 32,16 C 32,26 26,32 16,32 C 26,32 32,38 32,48 C 32,38 38,32 48,32 C 38,32 32,26 32,16 Z"
      fill="#120F24"
      stroke="#19E3B1"
      stroke-width="1.2"
      transform="rotate(45 32 32)"
      opacity="0.9"
    />

    <!-- Center Core Spark -->
    <circle cx="32" cy="32" r="4.5" fill="#FFFFFF" />
    <circle cx="32" cy="32" r="2.5" fill="#19E3B1" />
  </g>
</svg>


[workspace]
resolver = "2"
members = [
    "crates/darkhold-core",
    "crates/darkhold-engine",
]
# darkhold-bench is added here at Step 16, when the crate exists.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
anyhow = "1"
crc32fast = "1.4"
criterion = "0.5"
crossbeam-channel = "0.5"
futures-util = "0.3"
hdrhistogram = "7.5"
parking_lot = "0.12"
proptest = "1.4"
rand = "0.8"
rand_pcg = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
